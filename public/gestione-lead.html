<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestione lead · EMIDA</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0d10;color:#e8eaed}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #222;position:sticky;top:0;background:#0b0d10;z-index:2;flex-wrap:wrap}
h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.5px}select,input,button{background:#15181d;color:#e8eaed;border:1px solid #2a2f37;border-radius:8px;padding:8px 10px;font:inherit}
button{cursor:pointer}button.p{background:#fff;color:#000;border-color:#fff;font-weight:600}.chips{display:flex;gap:6px}.chip.on{background:#fff;color:#000}
.kpi{display:flex;gap:10px;padding:12px 18px;flex-wrap:wrap}.k{background:#15181d;border:1px solid #222;border-radius:10px;padding:10px 14px;min-width:130px}.k b{display:block;font-size:20px}.k span{color:#9aa0a6;font-size:12px}
.wrap{overflow:auto;padding:0 18px 30px}table{border-collapse:collapse;width:100%;min-width:1300px}th,td{padding:8px 10px;border-bottom:1px solid #1e2228;text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:#111418;color:#9aa0a6;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}td.w{white-space:normal;min-width:260px;max-width:420px;color:#c3c7cc}
tr:hover td{background:#12151a}.t{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}.t.Amministratore{background:#1d4ed8}.t.Impresa{background:#b45309}.t.o{background:#374151}
.n{text-align:right;font-variant-numeric:tabular-nums}#login{max-width:340px;margin:15vh auto;display:grid;gap:10px}a{color:#8ab4f8}
</style></head><body>
<form id="login"><h1>Gestione lead</h1><input value="alex" disabled><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="p">Entra</button><div id="err" style="color:#f87171"></div></form>
<div id="app" hidden>
<header><h1>LEAD · EMIDA</h1>
<select id="fSite"><option value="">Tutti i siti</option><option value="tettocondominiale">TettoCondominiale</option><option value="preventivotetto">PreventivoTetto</option><option value="puliziecondominialiverona">Pulizie Verona</option><option value="tettochiaro">TettoChiaro</option></select>
<div class="chips"><button class="chip on" data-t="">Tutti</button><button class="chip" data-t="Amministratore">Amministratori</button><button class="chip" data-t="Impresa">Imprese</button><button class="chip" data-t="altri">Altri</button></div>
<input id="q" placeholder="Cerca nome, email, tel, città…" style="flex:1;min-width:180px">
<button id="csv">Esporta CSV</button><button id="rl">↻</button></header>
<div class="kpi" id="kpi"></div><div class="wrap"><table><thead><tr><th>Data</th><th>Sito</th><th>Tipo</th><th>Nome</th><th>Cognome</th><th>Email</th><th>Telefono</th><th class="n">Importo €</th><th class="n">Piani</th><th class="n">Appart.</th><th>Città</th><th>Dettagli</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const L={tettocondominiale:'TettoCondominiale',preventivotetto:'PreventivoTetto',puliziecondominialiverona:'Pulizie Verona',tettochiaro:'TettoChiaro'};
let pw=sessionStorage.getItem('glpw')||'',rows=[],tipoF='';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(r){let p={};try{p=JSON.parse(r.payload_json||'{}')}catch{}const c=p.contact||{},a=p.answers||{},q=a.quote||{},e=p.estimate||{};
 let tipo=a.partner?'Impresa':(String(a.ruolo||'').toLowerCase().startsWith('ammin')?'Amministratore':(a.ruolo?a.ruolo[0].toUpperCase()+a.ruolo.slice(1):(r.site==='puliziecondominialiverona'?'Cliente pulizie':'Privato')));
 const lo=Number(e.low??e.min),hi=Number(e.high??e.max);const imp=q.stimaMensileEur!=null?Math.round(q.stimaMensileEur*12):(lo&&hi?Math.round((lo+hi)/2):(lo||hi||null));
 const full=(c.fullName||r.full_name||'').trim().split(/\s+/);const first=c.firstName||(full.length>1?full[0]:''),last=c.lastName||(full.length>1?full.slice(1).join(' '):full[0]||'');
 const extra=[q.ascensore&&'ascensore',q.areaEsterna&&'area esterna',q.garage&&'garage',q.piuScale&&'più scale'].filter(Boolean);
 let det=q.riepilogo?[q.riepilogo,q.stimaMensileEur!=null?q.stimaMensileEur+' €/mese + IVA':'','Extra: '+(extra.join(', ')||'nessuno')]:a.partner?['Candidatura '+(a.tipo||'impresa'),a.servizi||a.note||'']:[a.intervento||e.intervention,a.mq?a.mq+' mq':'',a.anno,(a.stato||[]).join(', '),lo&&hi?`range ${lo.toLocaleString('it-IT')}–${hi.toLocaleString('it-IT')} €`:''];
 if(r.event_type!=='lead')det.unshift('['+r.event_type+']');
 return{id:r.id,d:r.created_at,site:r.site,tipo,first,last,email:c.email||r.email||'',tel:c.phone||r.phone||'',imp,piani:q.piani??e.piani??'',app:q.appartamenti??a.appartamenti??'',city:a.city||a.comune||p.cap||'',det:det.filter(Boolean).join(' · ')}}
async function load(){const r=await fetch('/api/admin/leads?sites=all&limit=1000',{headers:{Authorization:'Basic '+btoa('alex:'+pw)},cache:'no-store'});if(r.status===401){sessionStorage.removeItem('glpw');throw new Error('Password errata')}const j=await r.json();if(!j.ok)throw new Error(j.error||'Errore');rows=j.rows.map(norm);$('login').hidden=true;$('app').hidden=false;render()}
function filt(){const s=$('fSite').value,q=$('q').value.toLowerCase();return rows.filter(r=>(!s||r.site===s)&&(!tipoF||(tipoF==='altri'?!['Amministratore','Impresa'].includes(r.tipo):r.tipo===tipoF))&&(!q||[r.first,r.last,r.email,r.tel,r.city,r.det].join(' ').toLowerCase().includes(q)))}
function render(){const f=filt(),sum=f.reduce((a,r)=>a+(r.imp||0),0);
 $('kpi').innerHTML=[['Lead',f.length],['Amministratori',f.filter(r=>r.tipo==='Amministratore').length],['Imprese',f.filter(r=>r.tipo==='Impresa').length],['Valore stimato',sum.toLocaleString('it-IT')+' €'],['Oggi',f.filter(r=>r.d&&r.d.slice(0,10)===new Date().toISOString().slice(0,10)).length]].map(([k,v])=>`<div class="k"><b>${v}</b><span>${k}</span></div>`).join('');
 $('tb').innerHTML=f.map(r=>`<tr><td>${esc(new Date(r.d).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}))}</td><td>${esc(L[r.site]||r.site)}</td><td><span class="t ${['Amministratore','Impresa'].includes(r.tipo)?r.tipo:'o'}">${esc(r.tipo)}</span></td><td>${esc(r.first)}</td><td>${esc(r.last)}</td><td><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></td><td><a href="tel:${esc(r.tel)}">${esc(r.tel)}</a></td><td class="n">${r.imp?r.imp.toLocaleString('it-IT'):''}</td><td class="n">${esc(r.piani)}</td><td class="n">${esc(r.app)}</td><td>${esc(r.city)}</td><td class="w">${esc(r.det)}</td></tr>`).join('')}
$('csv').onclick=()=>{const h=['Data','Sito','Tipo','Nome','Cognome','Email','Telefono','Importo','Piani','Appartamenti','Citta','Dettagli'];const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const t=[h.join(';'),...filt().map(r=>[r.d,L[r.site]||r.site,r.tipo,r.first,r.last,r.email,r.tel,r.imp,r.piani,r.app,r.city,r.det].map(c).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='lead.csv';a.click()};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');tipoF=b.dataset.t;render()});
$('fSite').onchange=render;$('q').oninput=render;$('rl').onclick=()=>load().catch(e=>alert(e.message));
$('login').onsubmit=e=>{e.preventDefault();pw=$('pw').value;sessionStorage.setItem('glpw',pw);load().catch(x=>$('err').textContent=x.message)};
if(pw)load().catch(()=>{});
</script></body></html>
